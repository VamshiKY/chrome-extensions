<!DOCTYPE html>
<html>
<head>
  <title>Stock Price Tracker Options</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      color: #4285f4;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }
    .option-group {
      margin-bottom: 20px;
      padding: 15px;
      border: 1px solid #eee;
      border-radius: 5px;
    }
    .option-group h2 {
      margin-top: 0;
      font-size: 18px;
    }
    label {
      display: block;
      margin-bottom: 10px;
    }
    input[type="text"], select {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 3px;
    }
    button {
      padding: 8px 15px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    button:hover {
      background-color: #3367d6;
    }
    .stock-list {
      margin-top: 15px;
    }
    .stock-item {
      display: flex;
      justify-content: space-between;
      padding: 8px;
      border-bottom: 1px solid #eee;
    }
    .stock-item:last-child {
      border-bottom: none;
    }
    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 3px;
      display: none;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <h1>Stock Price Tracker Options</h1>
  
  <div class="option-group">
    <h2>Default Stocks</h2>
    <p>These stocks will be added when a user first installs the extension.</p>
    
    <div id="defaultStocks" class="stock-list">
      <!-- Default stocks will be listed here -->
    </div>
    
    <div style="margin-top: 15px;">
      <input type="text" id="newDefaultStock" placeholder="Add default stock (e.g., AAPL)">
      <button id="addDefaultStock">Add</button>
    </div>
  </div>
  
  <div class="option-group">
    <h2>Update Frequency</h2>
    <label>
      Check for stock updates every:
      <select id="updateFrequency">
        <option value="1">1 minute</option>
        <option value="5" selected>5 minutes</option>
        <option value="15">15 minutes</option>
        <option value="30">30 minutes</option>
        <option value="60">1 hour</option>
      </select>
    </label>
  </div>
  
  <div class="option-group">
    <h2>Display Settings</h2>
    <label>
      <input type="checkbox" id="showBadge" checked>
      Show number of tracked stocks on extension icon
    </label>
    <label>
      <input type="checkbox" id="showChangeAmount" checked>
      Show price change amount (not just percentage)
    </label>
  </div>
  
  <div class="option-group">
    <h2>Market Settings</h2>
    <label>
      Default market for new stocks:
      <select id="defaultMarket">
        <option value="NASDAQ" selected>NASDAQ</option>
        <option value="NYSE">NYSE</option>
        <option value="AMEX">AMEX</option>
        <option value="NSE">NSE (India)</option>
        <option value="BSE">BSE (India)</option>
        <option value="TSE">TSE (Toronto)</option>
        <option value="LSE">LSE (London)</option>
      </select>
    </label>
  </div>
  
  <button id="saveOptions">Save Options</button>
  
  <div id="status" class="status"></div>
  
  <script src="options.js"></script>
</body>
</html>
