<!DOCTYPE html>
<html>
<head>
  <title>Stock Price Tracker</title>
  <meta charset="UTF-8">
  <style>
    body {
      width: 350px;
      font-family: Arial, sans-serif;
      padding: 10px;
      margin: 0;
      color: #333;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }
    h1 {
      font-size: 18px;
      margin: 0;
      color: #4285f4;
    }
    .stock-list {
      margin-bottom: 15px;
      max-height: 300px;
      overflow-y: auto;
      border-radius: 4px;
      border: 1px solid #eee;
    }
    .stock-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #eee;
      transition: background-color 0.2s;
    }
    .stock-item:hover {
      background-color: #f9f9f9;
    }
    .stock-item:last-child {
      border-bottom: none;
    }
    .stock-symbol {
      font-weight: bold;
      flex: 1;
    }
    .stock-price {
      font-weight: bold;
      flex: 1;
      text-align: center;
    }
    .remove-stock {
      background-color: #f44336;
      color: white;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 8px;
      transition: background-color 0.2s, transform 0.1s;
    }
    .remove-stock:hover {
      background-color: #d32f2f;
      transform: scale(1.1);
    }
    .positive {
      color: green;
    }
    .negative {
      color: red;
    }
    .add-stock {
      margin-top: 15px;
      position: relative;
      display: flex;
      gap: 8px;
    }
    input {
      padding: 10px;
      flex-grow: 1;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #4285f4;
      outline: none;
      box-shadow: 0 0 0 2px rgba(66, 133, 244, 0.2);
    }
    button {
      padding: 10px 15px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s, transform 0.1s;
    }
    button:hover {
      background-color: #3367d6;
    }
    button:active {
      transform: scale(0.98);
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    .error {
      color: #f44336;
      font-size: 12px;
      margin-top: 8px;
      display: none;
      padding: 5px;
      border-radius: 3px;
      background-color: rgba(244, 67, 54, 0.1);
    }
    .suggestion-item.active {
      background-color: #f5f5f5;
    }
    .currency-indicator {
      font-size: 0.8em;
      color: #666;
      margin-left: 4px;
    }
    .last-updated {
      font-style: italic;
    }
    
    /* Loading animation */
    .loading-price {
      display: inline-block;
      position: relative;
      width: 80px;
      height: 13px;
    }
    .loading-price div {
      position: absolute;
      top: 0;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #ddd;
      animation-timing-function: cubic-bezier(0, 1, 1, 0);
    }
    .loading-price div:nth-child(1) {
      left: 8px;
      animation: loading1 0.6s infinite;
    }
    .loading-price div:nth-child(2) {
      left: 8px;
      animation: loading2 0.6s infinite;
    }
    .loading-price div:nth-child(3) {
      left: 32px;
      animation: loading2 0.6s infinite;
    }
    .loading-price div:nth-child(4) {
      left: 56px;
      animation: loading3 0.6s infinite;
    }
    @keyframes loading1 {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }
    @keyframes loading2 {
      0% { transform: translate(0, 0); }
      100% { transform: translate(24px, 0); }
    }
    @keyframes loading3 {
      0% { transform: scale(1); }
      100% { transform: scale(0); }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Stock Price Tracker</h1>
    <button id="refresh">Refresh</button>
  </div>
  
  <div class="stock-list" id="stockList">
    <!-- Stock items will be added here dynamically -->
    <div class="stock-item">
      <span class="stock-symbol">Loading stocks...</span>
      <span class="stock-price">
        <div class="loading-price">
          <div></div><div></div><div></div><div></div>
        </div>
      </span>
      <span style="width: 22px;"></span><!-- Placeholder for remove button -->
    </div>
  </div>
  
  <div class="add-stock">
    <input type="text" id="newStock" placeholder="Search stock (e.g., AAPL, Reliance)">
    <button id="addStock">Add</button>
  </div>
  <div class="error" id="error">Invalid stock symbol</div>
  
  <div class="last-updated" id="lastUpdated" style="margin-top: 15px; font-size: 11px; color: #666; text-align: right;"></div>

  <script src="autosuggest.js"></script>
  <script src="popup.js"></script>
</body>
</html>
